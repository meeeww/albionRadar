<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Radar log</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; font: 14px/1.4 ui-sans-serif, sans-serif; background: #10140f; color: #e7e1d1; }
  header { display: flex; justify-content: space-between; gap: 16px; align-items: end; padding: 16px 18px 8px; }
  h1 { font-size: 18px; margin: 0 0 4px; }
  a { color: #e2c56a; }
  p { margin: 0; color: #b7b09d; }
  .controls { display: flex; gap: 8px; }
  input, button { background: #1d2118; color: inherit; border: 1px solid #3a4030; border-radius: 6px; padding: 6px 10px; }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 6px 10px; border-bottom: 1px solid #2a3024; vertical-align: top; font-variant-numeric: tabular-nums; }
  th { position: sticky; top: 0; background: #1a1e16; }
  tr.gather td { color: #e2c56a; }
  tr.selected td { background: #2a3320; }
  tr { cursor: pointer; }
  .scroll { height: calc(100vh - 78px); overflow: auto; }
  code { font-family: ui-monospace, monospace; }
</style>
</head>
<body>
<header>
  <div>
    <h1>Log</h1>
    <p id="blurb">Gather messages, plus harvest, hit, and mount packets. Movement is left out. Click a gather line to keep only the traffic near it.</p>
    <p><a href="/">Radar</a></p>
  </div>
  <div class="controls">
    <input id="filter" placeholder="Filter by text or code" />
    <button type="button" id="near" disabled>Show all</button>
    <button type="button" id="debug">Debug packets</button>
    <button type="button" id="clear">Clear</button>
  </div>
</header>
<div class="scroll">
  <table>
    <thead><tr><th>Time</th><th>Kind</th><th>Code</th><th>Message</th></tr></thead>
    <tbody id="rows"></tbody>
  </table>
</div>
<script>
const rows = []
const body = document.getElementById('rows')
const filter = document.getElementById('filter')
const near = document.getElementById('near')
let debug = false
let focus = null
const blurb = document.getElementById('blurb')
const debugButton = document.getElementById('debug')

function debugText() {
  debugButton.textContent = debug ? 'Debug packets on' : 'Debug packets'
  blurb.textContent = debug
    ? 'Debug is on: also logging move requests 21 and 22, harvestable event 40, and new mob event 123. Copy this page when sending a log.'
    : 'Gather messages, plus harvest, hit, and mount packets. Movement is left out. Click a gather line to keep only the traffic near it.'
}

function time(t) {
  const d = new Date(t)
  return d.toLocaleTimeString(undefined, { hour12: false }) + '.' + String(d.getMilliseconds()).padStart(3, '0')
}

function show(row) {
  if (focus && Math.abs(row.t - focus.t) > 4000) return false
  const q = filter.value.trim().toLowerCase()
  if (!q) return true
  return [row.kind, row.code, row.status, row.text].join(' ').toLowerCase().includes(q)
}

function render(row) {
  const tr = document.createElement('tr')
  if (row.kind === 'gather') tr.className = 'gather'
  if (focus && focus.id === row.id) tr.className += ' selected'
  tr.innerHTML = '<td>' + time(row.t) + '</td><td>' + row.kind + '</td><td><code>' + (row.code ?? '') + '</code></td><td>' + (row.text || '') + '</td>'
  tr.onclick = () => {
    if (row.kind !== 'gather') return
    focus = focus && focus.id === row.id ? null : row
    near.disabled = !focus
    draw()
  }
  return tr
}

function draw() {
  body.innerHTML = ''
  for (const row of rows) {
    if (!show(row)) continue
    body.appendChild(render(row))
  }
}

function add(row) {
  rows.push(row)
  if (rows.length > 500) rows.shift()
  if (show(row)) {
    body.appendChild(render(row))
  }
}

filter.oninput = draw
near.onclick = () => { focus = null; near.disabled = true; draw() }
document.getElementById('clear').onclick = async () => {
  await fetch('/api/log/clear', { method: 'POST' })
  rows.length = 0
  focus = null
  draw()
}
debugButton.onclick = async () => {
  debug = !debug
  debugText()
  await fetch('/api/log/debug', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ enabled: debug }),
  })
}

fetch('/api/log').then((res) => res.json()).then((data) => {
  debug = Boolean(data.debug)
  debugText()
  for (const row of data.logs) add(row)
})

const source = new EventSource('/stream')
source.addEventListener('log', (event) => add(JSON.parse(event.data)))
</script>
</body>
</html>
